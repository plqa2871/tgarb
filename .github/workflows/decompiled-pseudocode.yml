name: Package Termux ARM64 executable

on:
  push:
    paths:
      - lib
      - TERMUX.md
      - .github/workflows/decompiled-pseudocode.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Android ARM64 executable
        shell: bash
        run: |
          set -euo pipefail
          test -s lib
          file lib | grep -q 'ELF 64-bit.*ARM aarch64'
          readelf -h lib | grep -q 'Machine:.*AArch64'

      - name: Package unchanged executable for Termux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging verify
          install -m 0755 lib staging/lib
          cp TERMUX.md staging/README.txt
          cmp lib staging/lib
          tar -czf termux-arm64.tar.gz -C staging lib README.txt
          tar -xzf termux-arm64.tar.gz -C verify
          cmp lib verify/lib
          test -x verify/lib

      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: termux-arm64
          path: termux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30